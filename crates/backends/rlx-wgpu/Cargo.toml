[package]
name = "rlx-wgpu"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Cross-platform GPU backend for RLX via wgpu (Metal/Vulkan/DX12)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-wgpu --features backend-tests`.
backend-tests = []
default = []
native-splat = []
# `Op::GaussianSplatRender` via CPU reference (D2H) when `splat` is enabled.
splat = ["rlx-cpu/splat"]
# Single-kernel on-chip FFT for n in (1024, 2048]: keeps the whole transform in
# workgroup memory (one DRAM load + store) instead of the multi-launch path that
# round-trips DRAM per outer stage. Runtime gate `RLX_FFT_FAST=0` disables.
native-gpu-fft = []
# Generate the tiled `matmul` entry point FROM a typed `KernelSchedule` (see
# `kernel_schedule_emit`) instead of the hand-written `kernels/matmul.wgsl`. Off
# by default: the shipping shader stays the shipping path until the emitted one
# is measured at least as fast (`examples/schedule_matmul_ab.rs`).
schedule-codegen = []

[build-dependencies]
# Generates the standalone unary/activation WGSL switch from the shared
# scalar-expression manifest (single source across backends).
rlxsl = { workspace = true }

[dependencies]
rlx-ir = { workspace = true }
# Shape-keyed kernel-variant dispatch table, shared with CUDA/ROCm/Metal.
rlx-gpu-dispatch = { workspace = true }
rlx-unfuse = { workspace = true }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.18", default-features = false, features = ["compile"] }
rlx-compile = { workspace = true }
rlx-cpu = { workspace = true, features = ["splat"] }
rlx-gpu-host = { workspace = true }
rlx-gguf = { workspace = true }

# wgpu 30: WebGPU-spec dispatch/present renames, `get_mapped_range` → Result,
# signed `%` fix on Vulkan SPIR-V, Metal bindless storage buffers, etc.
# Backends picked explicitly so one build covers macOS (Metal), Linux and
# Windows (Vulkan, plus DX12 on Windows — this crate prefers neither and lets
# wgpu's own adapter ordering decide). GLES excluded.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "dx12",
    "metal",
    "wgsl",
] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# MSL/HLSL inspection for `examples/dump_msl.rs` — see that file. Dev-only.
naga = { version = "29", features = ["wgsl-in", "msl-out"] }
# Path-only (no version): test-only cycle on the umbrella crate, which is
# published last. cargo strips path-only dev-deps from the published manifest,
# so this never resolves against crates.io and needs no per-release pin bump.
rlx = { path = "../../rlx", default-features = false, features = ["cpu", "gpu"] }
rlx-runtime = { path = "../../core/rlx-runtime", features = ["gpu"] }
rlx-gguf = { workspace = true }
rlx-ir = { workspace = true }
half = "2"
pollster = "0.3"
bytemuck = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["splat"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

