[package]
name = "mahbot-rlx-gpu-dispatch"
version                = "0.2.18-mahbot.3"
edition.workspace      = true
rust-version.workspace = true
description = "Shape-keyed GPU kernel-variant dispatch table + tile parameter space shared by every RLX GPU backend."
authors.workspace      = true
license.workspace      = true
keywords = ["gpu", "dispatch", "autotune", "rlx", "kernels"]
categories.workspace   = true
readme                 = "README.md"
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-gpu-dispatch"

# Deliberately dependency-free. This crate holds DECISIONS (which physical
# schedule for which shape on which device) and the parameter space they range
# over — no kernel sources, no device APIs, no filesystem, no environment. That
# is what lets every backend depend on it: rlx-metal has no business linking the
# CUDA/HIP source strings in rlx-gpu-kernels just to read a dispatch table.

[lib]
name = "rlx_gpu_dispatch"

[dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-gpu-dispatch --features backend-tests`.
backend-tests = []

[[test]]
name = "cost_model_ranking"
required-features = ["backend-tests"]
