[package]
name = "rlx-flow"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Block assembly-line API for RLX model builders — fusion-first, config-driven"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true, features = ["serialize"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
# Back-edges: rlx-opt (tier 4) and rlx-runtime (tier 7) both publish AFTER
# rlx-flow (tier 1), and rlx-runtime depends on rlx-flow, so the cycle cannot be
# broken by retiering. Keep these PATH-ONLY (no `version`): cargo strips
# path-only dev-deps from the published manifest, so `cargo publish -p rlx-flow`
# never resolves them against crates.io. `{ workspace = true }` does NOT work
# here — it inherits the workspace version, which cargo then tries
# to resolve and fails on ("candidate versions found which didn't match").
# The path still wins for local `cargo test`.
rlx-opt = { path = "../rlx-opt" }
rlx-runtime = { path = "../rlx-runtime", features = ["cpu", "training"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-flow --features backend-tests`.
backend-tests = []

[[test]]
name = "dit_flow_train"
required-features = ["backend-tests"]

[[test]]
name = "downstream_layer_stage"
required-features = ["backend-tests"]

[[test]]
name = "mla_attn_parity"
required-features = ["backend-tests"]
