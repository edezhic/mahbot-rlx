[package]
name = "rlx-autodiff"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "JAX-shaped transforms for RLX MIR — autodiff, JVP/HVP, vmap"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true }
rlx-fusion = { workspace = true }
half = "2"
thiserror = "2"

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-autodiff --features backend-tests`.
backend-tests = []
default = []
# Accelerator passthroughs for the TEST binaries. The gather-backward rank-1 bug
# was present verbatim in all five backends, so the regression test for it has
# to be runnable somewhere other than CPU; without these the dev-dependency on
# `rlx` is pinned to `cpu` and the test can only ever prove the CPU path.
#   RLX_FORCE_DEVICE=metal cargo test -p rlx-autodiff --features metal,backend-tests --test indexing_grad
metal = ["rlx/metal"]
mlx = ["rlx/mlx"]
gpu = ["rlx/gpu"]
cuda = ["rlx/cuda"]
rocm = ["rlx/rocm"]

[dev-dependencies]
# Path-only (no version): test-only cycle on the umbrella crate, which is
# published last. cargo strips path-only dev-deps from the published manifest,
# so this never resolves against crates.io and needs no per-release pin bump.
rlx = { path = "../../rlx", default-features = false, features = ["cpu"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

