[package]
name = "rlx-collectives"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
repository.workspace   = true
description = "In-graph collective ops (all-reduce) for tensor-parallel RLX execution"
keywords.workspace      = true
categories.workspace    = true
homepage.workspace      = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true }
# default-features off: the collective's CPU kernel only needs rlx-cpu's
# op-registry, not BLAS. Dropping the `blas` feature keeps the openblas link
# out of the build so it cross-compiles to aarch64 (Raspberry Pi / qemu),
# where no OpenBLAS exists. (rlx-runtime already links platform BLAS for the
# actual matmul path where it's wanted.)
rlx-cpu = { path = "../../backends/rlx-cpu", version = "0.2.17", default-features = false }
rlx-driver = { workspace = true }

[features]
default = []
# Zero-config LAN node discovery via mDNS-SD (Bonjour/Avahi). Opt-in; the
# unicast rendezvous path (DISCOVER_HOST) needs no extra deps.
mdns = ["rlx-driver/mdns"]

# The host-delegate tests in this crate's lib build a real session on the
# host's native backend, so the runtime backend each one needs is opt-in here
# instead of being requested by the target-specific dev-dependency below — a
# `features` request there is target-blind in the other direction too: cargo
# unions it into *every* crate's test build on that host, which is how a bare
# `cargo test` on macOS compiled rlx-metal / rlx-coreml in.
# Road back: `cargo test -p rlx-collectives --features metal,coreml`, or
# `cargo run -p rlx-collectives --features metal,coreml --example dist_node`.
metal = ["rlx-runtime/metal"]
coreml = ["rlx-runtime/coreml"]

[dev-dependencies]
# Path-only (no version): test-only cycle on rlx-runtime, which publishes
# right after rlx-collectives in the same tier (7). cargo strips path-only
# dev-deps from the published manifest, so this never resolves against
# crates.io and needs no per-release pin bump.
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["cpu"] }
# The coordinator/worker mode ships serialized IR graphs over the wire, so the
# example needs rlx-ir's serde derives + a JSON codec (dev-only).
rlx-ir = { path = "../rlx-ir", features = ["serialize"] }
# `WEIGHTS_FMT=q8` demo: quantize + write a GGUF stage weight that the worker
# loads packed and runs through a DequantMatMul graph (pure Rust, dev-only).
rlx-gguf = { path = "../../io/rlx-gguf" }
# `grad()` for the collective-VJP structural tests. Path-only (no version):
# rlx-autodiff has no dependency on rlx-collectives, so this adds no cycle, and
# cargo strips path-only dev-deps from the published manifest.
rlx-autodiff = { path = "../rlx-autodiff" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `dist_job` example: read the job description from a TOML config file.
toml = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# `gpu` (portable wgpu-on-Metal) so the collective host-delegate test for this
# fork's own backend keeps running for real; `metal` and `coreml` are this
# crate's own features now (see [features]) so a bare macOS `cargo test`
# compiles neither — `dist_node` on Apple asks for them:
# `cargo run -p rlx-collectives --features metal,coreml --example dist_node`.
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["gpu"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
# Kept as upstream wrote it: `dist_node`'s `autofleet` lane calls
# `rlx_xdna::overlay_from_env` / `rlx_xdna::npu_gemm`, which rlx-xdna's
# `xrt`/`direct` features gate, and the example is built by a bare `cargo test`
# on Linux, so moving those features would turn a documented command red.
# (Inert on this fork's host.)
# Enable the backends a Linux x86_64 host may expose so `dist_node` can pin
# ranks to Device::{Cuda,Rocm,Xdna,Cpu} — NVIDIA GPUs, ROCm GPUs, an XDNA NPU.
# All build driverless (cudarc/hip are dlopen'd; xdna is libc/libloading), so
# the union is portable across CUDA and ROCm hosts alike.
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["cuda", "rocm", "xdna", "cpu"] }
# `autofleet` runs the NPU's INT8 GEMM lane directly through rlx-xdna when an
# overlay is configured (INT8/fixed-shape → not an f32-mesh rank).
rlx-xdna = { path = "../../backends/rlx-xdna", features = ["xrt", "direct"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["mdns"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
