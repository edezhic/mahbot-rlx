[package]
name = "rlx-runtime"
build = "build.rs"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX runtime — feature-gated backends, session API, compile+execute pipeline"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-runtime --features backend-tests`.
backend-tests = []
default = ["cpu", "model-io"]

# On-disk model containers: `.rlxp` packages, MLX weight dirs / `.npz`, and
# HuggingFace `.dduf`. In `default` so nothing that takes the defaults notices,
# but separable — a distributed **node** receives its stage over the wire and
# never opens a model file, and these three crates drag in the whole archive
# stack (zip ×2, zstd, bzip2, flate2, zopfli, npyz, safetensors, serde_yaml,
# aes/sha1/sha2/pbkdf2, and pest + num-bigint via the NeMo pickle reader).
# Dropping them is what lets `rlx-ffi`'s Apple/embedded archive stay a compute
# artifact instead of a file-format library.
#
# `gguf://`, `safetensors://` and `file://` weight URIs keep working without
# it: rlx-gguf is small and its quant kernels back `quantized_kv`, and the
# safetensors reader here is a 40-line header parse, not the crate.
model-io = ["dep:rlx-pkg", "dep:rlx-mlx-io", "dep:rlx-dduf"]

# ── CPU backends ─────────────────────────────────────────────
# Base CPU with SIMD kernels (NEON/AVX) + persistent thread pool
cpu = ["dep:rlx-cpu", "rlx-cpu/splat"]

# VRAM-aware device selection: fold host GPU/VRAM detection
# (rlx-hwprofile) into `fastest_device_with_vram`. Off by default — only
# callers that want memory-floored device picks pay the probe/detection dep.
hwprofile = ["dep:rlx-hwprofile"]

# Compile-time gated kernel tracing (plan #7).
# Off by default — production builds pay zero overhead; turn on for
# debugging op dispatch / shapes / per-kernel timing.
kernel-trace = []

# Structured observability / audit spine (`obs.rs`). Off by default — routes
# diagnostics through `tracing` structured events (the foundation for a
# per-inference audit trail). A downstream product swaps in its own subscriber.
tracing = ["dep:tracing", "dep:tracing-subscriber"]

# NaN/inf check epilogues (plan #18).
# When on, every CompiledGraph::run output is scanned for NaN/inf
# and the offending output node is reported. Off by default since
# the scan is O(output_size).
nan-check = []

# Mock request fixtures (plan #64). Off by default — only compiled
# in when explicitly requested OR during tests. Turn on if a
# downstream serving crate wants the canned OpenAI-shaped payloads.
mock-requests = []

# mmap-backed quantized KV cache. Off by default — only callers that
# actually need to spill long contexts to disk or share KV across
# processes pay the memmap2 + libc dep. Enables MmapKvLayer /
# MmapKvCache in `quantized_kv` which page-fault-load blocks on demand
# from a file-backed (or anonymous) mapping. Faster than read()/write()
# for long contexts because the kernel handles dirty-page write-back
# in batches and dequant reads zero-copy from the page cache.
mmap-kv = ["dep:memmap2"]

# BLAS acceleration (pick ONE per platform)
blas-accelerate = ["cpu"]                          # macOS: Apple Accelerate (via rlx-cpu build.rs)
blas-mkl = ["cpu", "rlx-cpu/blas-mkl"]              # Intel/AMD: MKL instead of OpenBLAS
amx-sme = ["cpu", "rlx-cpu/amx-sme"]                # Apple M4+: direct ARM SME2 GEMM microkernel
amx-bnns = ["cpu", "rlx-cpu/amx-bnns"]                # Apple: BNNS bf16/f16 low-precision matmul
blas-openblas = ["cpu"]                            # Linux/Windows: OpenBLAS (rlx-cpu default)

# Future: direct hardware access. Declared (empty) so device_ext.rs's
# `cfg!(feature = "...")` checks compile cleanly; flip to real deps
# once the corresponding backend crates land.
ane = []                           # Apple Neural Engine (via CoreML/ANE framework)
# amx = ["cpu"]                    # Apple AMX coprocessor (via Accelerate internally)
# mlas = ["cpu"]                   # Microsoft MLAS (from ONNX Runtime)

# ── GPU backends ─────────────────────────────────────────────
# Portable GPU via wgpu (Metal on macOS, Vulkan on Linux, DX12 on Windows)
# Every backend feature implies `cpu`: the runtime's core (e.g. the always-
# compiled `MoeResidencyStats` re-export, CPU fallbacks / splat between GPU
# segments) is gated on `feature = "cpu"`, so a backend without it fails to
# compile. `cpu` already pulls `rlx-cpu/splat`, so listing it is sufficient.
gpu = ["cpu", "dep:rlx-wgpu", "rlx-wgpu/splat"]

# Apple Metal (MPSGraph + custom MSL). Splat: CPU reference + common IR.
#
# Deliberately no `rlx-sparse/metal` forward here: forwarding it made
# rlx-sparse's own units compile with `feature = "metal"` but without the
# `rlx-metal` extern, so `cargo test --workspace --features backend-tests` broke
# with `cannot find crate rlx_metal` in rlx-sparse. The sparse
# kernel-registration tests are selected with the crate instead — `-p rlx-sparse`
# (see the `test-gpu` / `test-mlx` recipes, which also keep the `metal`/`mlx`
# gated modules of rlx-sparse compiled).
metal = ["cpu", "dep:rlx-metal"]

# Apple MLX (unified memory); splat via CPU reference on host buffers. The MLX
# sparse tests are selected the same way, as above.
mlx = ["cpu", "dep:rlx-mlx"]

# Opt-in MLX C++ `quantized_matmul` for mxfp packs (see `rlx-mlx/native-mxfp`).
mlx-native-mxfp = ["mlx", "rlx-mlx/native-mxfp"]
# Linux/WSL: MLX with upstream CUDA backend (long nvcc compile — opt-in only).
mlx-cuda = ["mlx", "rlx-mlx/cuda"]

# Apple CoreML / Neural Engine (ANE) — lowers the IR to a MIL ML Program
# and runs it through CoreML.framework.
# `ane` is the marker `feature_compiled(Device::Ane)` gates on. Enabling
# `coreml` without it made that report `false` while the backend was compiled in
# and `is_available` said `true` — and `skip_unless_device` uses the pair to pick
# skip-vs-fail, so ANE tests silently skipped on builds that could run them.
coreml = ["cpu", "ane", "dep:rlx-coreml"]

# All Apple RLX backends: Metal (incl. MPS), MLX, portable wgpu-on-Metal, CoreML/ANE.
apple = ["cpu", "metal", "mlx", "gpu", "coreml"]

# Android on-device stack: CPU (NEON; portable GEMM unless OPENBLAS_LIB_DIR is set)
# + wgpu (Vulkan). See android/README.md for the JNI demo.
android = ["cpu", "gpu"]
# Same Cargo features as `android`; use with OPENBLAS_LIB_DIR (android/build.sh --blas).
android-blas = ["cpu", "gpu"]

# On-device training / backward propagation. Turns on the autodiff backward
# decompose path for device *selection* (so a backend is chosen for a graph that
# carries `*Backward` ops) and, with `coreml`, the ANE native backward kernels +
# MLUpdateTask path. `rlx-opt/training` is already default-on; named here so the
# decompose stays available even if a downstream build strips rlx-opt's defaults.
# Off by default — inference builds keep the lean op surface and pay zero cost.
training = ["rlx-opt/training", "rlx-coreml?/training", "dep:rlx-optim"]

# NVIDIA CUDA native; native CUDA tile raster.
cuda = ["cpu", "dep:rlx-cuda"]

# Route GPU FFT through NVIDIA cuFFT (see rlx-cuda's `cufft` feature).
cufft = ["cuda", "rlx-cuda/cufft"]

# Native single-kernel Stockham FFT (see rlx-cuda's `native-cuda-fft` feature).
native-cuda-fft = ["cuda", "rlx-cuda/native-cuda-fft"]

# Single-kernel on-chip FFT for Metal/wgpu (n in (1024, 4096]/(1024, 2048]):
# whole transform in threadgroup memory, no per-stage DRAM round-trip.
# Forwards to whichever GPU backend crates are compiled. `RLX_FFT_FAST=0` disables.
native-gpu-fft = ["rlx-metal?/native-gpu-fft", "rlx-wgpu?/native-gpu-fft"]

# AMD GPU (ROCm/HIP); splat via CPU reference between segments.
rocm = ["cpu", "dep:rlx-rocm"]

# Google TPU via libtpu's PJRT plugin
tpu = ["cpu", "dep:rlx-tpu"]

# ── Cross-platform GPU APIs ─────────────────────────────────
# Native Vulkan compute backend (`Device::Vulkan`) — its own `ash` instance /
# device / queue and embedded SPIR-V kernels, NOT the wgpu Vulkan adapter
# (that remains `Device::Gpu`). Dynamic-loaded, so it compiles with no driver.
vulkan = ["cpu", "dep:rlx-vulkan"]
directx = []                       # DirectX 12 compute (Windows)

# ── Intel GPU ───────────────────────────────────────────────
# Intel Arc / Data Center Max via oneAPI Level Zero (`Device::OneApi`). Owns its
# own `libze_loader` context + SPIR-V compute kernels (the peak Intel path, NOT
# the wgpu/Vulkan portability adapters). Dynamic-loaded, so it compiles with no
# oneAPI runtime present (macOS / CI) and reports unavailable there.
oneapi = ["cpu", "dep:rlx-oneapi"]

# ── Qualcomm NPU ────────────────────────────────────────────
# Hexagon NPU via QNN / AI Engine Direct (`Device::Hexagon`). In-process FFI to
# a QNN backend library; needs QNN_SDK_ROOT at build time for the SDK headers.
qnn = ["cpu", "dep:rlx-qnn"]

# ── AMD NPU ─────────────────────────────────────────────────
# XDNA / Ryzen AI NPU (`Device::Xdna`) via the `amdxdna` driver. Detection +
# execution seam: pure Rust, no SDK/toolchain at build time. `is_available` is
# honest (needs hardware + XRT runtime); execution is unimplemented until the
# AIE kernel path lands.
xdna = ["cpu", "dep:rlx-xdna", "rlx-xdna/xrt", "rlx-xdna/direct"]

# ── External GPU ────────────────────────────────────────────
# Discrete GPU on a USB4/Thunderbolt PCIe tunnel (`Device::Egpu`) — the path for
# hosts with no in-tree class-0x03 driver (Apple Silicon). Pure Rust, no SDK at
# build time. `is_available` requires device bring-up, which is unimplemented,
# so this registers the seam and reports what is missing without dispatching.
egpu = ["cpu", "dep:rlx-egpu", "rlx-egpu/dext"]

# FPGA / SystemVerilog export (`rlx_runtime::export`). Offline artifact emit —
# does not register a runtime Device / Backend.
fpga = ["dep:rlx-fpga"]

[dependencies]
rlx-ir = { workspace = true, features = ["serialize"] }
# Tile parameter space + analytical cost model, for the device-free schedule
# axis of `check`. Not a GPU dependency: the crate is dependency-free, holds no
# kernel sources, and touches neither the filesystem nor a driver.
rlx-gpu-dispatch = { workspace = true }
# Structured observability / audit spine (`obs.rs`), off by default. Optional so
# the base build stays lean (empty-prelude ethos) and pays zero overhead.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
rlx-opt = { workspace = true }
# Host-side training-step optimizers (Adam/AdamW/Lion/Muon/Sophia/…) for the
# CoreML training session. Only pulled under `training`.
rlx-optim = { workspace = true, optional = true }
rlx-driver = { workspace = true }
rlx-hwprofile = { workspace = true, optional = true }
rlx-cpu = { workspace = true, optional = true }
rlx-mlx = { workspace = true, optional = true }
rlx-wgpu = { workspace = true, optional = true }
rlx-vulkan = { workspace = true, optional = true }
rlx-cuda = { workspace = true, optional = true }
rlx-rocm = { workspace = true, optional = true }
rlx-oneapi = { workspace = true, optional = true }
rlx-tpu = { workspace = true, optional = true }
rlx-qnn = { workspace = true, optional = true, features = ["runtime"] }
rlx-xdna = { workspace = true, optional = true }
rlx-egpu = { workspace = true, optional = true }
rlx-fpga = { workspace = true, optional = true }
rlx-macros = { workspace = true }
# rlx-compile: used unconditionally by src/check.rs, so it belongs in
# [dependencies], not only [dev-dependencies].  The dev-dep entry
# below is preserved for tests that need the `training` feature.
rlx-compile = { workspace = true }
half = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
inventory = "0.3"
memmap2 = { version = "0.9", optional = true }
rlx-gguf = { workspace = true }
rlx-pkg = { workspace = true, optional = true }
rlx-mlx-io = { workspace = true, optional = true }
rlx-dduf = { workspace = true, optional = true }
# rlx-gpu = { path = "../rlx-gpu", version = "0.2.18", optional = true }
# rlx-cuda = { path = "../../backends/rlx-cuda", version = "0.2.18", optional = true }

# rlx-metal is Apple-only (Metal is an Apple API). Make it a dependency solely on
# Apple targets — excluding watchOS, which has no Metal compute — so the `metal`
# feature only pulls it where the backend actually exists — no non-Apple stub.
# Matches the source gating + rlx-metal's `rlx_metal_host`:
# `all(target_vendor = "apple", not(target_os = "watchos"))`.
[target.'cfg(all(target_vendor = "apple", not(target_os = "watchos")))'.dependencies]
rlx-metal = { workspace = true, optional = true }
# CoreML / ANE is an Apple-only framework (rlx-coreml's `rlx-cpu` bridge is
# itself Apple-gated), so — like rlx-metal — it must only be a dependency on
# Apple targets. Previously in the general `[dependencies]`, which made any
# transitive `coreml` feature (pulled by the TTS crates on Linux) try to
# compile rlx-coreml on Linux → `cannot find crate rlx_cpu`. The `coreml`
# feature's `dep:rlx-coreml` is a no-op on non-Apple targets (same as
# `metal`/`dep:rlx-metal`).
rlx-coreml = { workspace = true, optional = true }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
rlx-autodiff = { workspace = true }
rlx-fusion = { workspace = true }
# Warm-tier kernel codegen manifest — the `kernel_dsl_matches_cpu_oracle` test
# checks its scalar-expression math against the trusted CPU activation kernel.
rlxsl = { workspace = true }
# Cross-backend parity tests build real model blocks (e.g. MLA) via the flow
# DSL, then run them on each backend. Dev-only; the rlx-flow↔rlx-runtime edge is
# a dev-dependency cycle (allowed by cargo, never a normal-build cycle).
rlx-flow = { workspace = true }
rayon = "1"
rlx-compile = { workspace = true, features = ["training"] }
# rlx-splat moved out of tree; splat examples/tests below are disabled until it returns.
# rlx-splat = { path = "../rlx-splat", version = "0.2.18", default-features = false, features = ["test-support", "io"] }
# Downstream demonstration packages used in integration tests.
# The sparse kernel-registration tests need rlx-sparse's `metal`/`mlx`; those
# features are enabled by the recipes that run them (`just test-mlx` /
# `just test-gpu` select `-p rlx-sparse`), not from here — a macOS-only
# dev-dependency row is unioned into *every* test build on that host, which is
# what pulled rlx-metal / rlx-mlx / the vendored MLX C++ build into a bare
# `cargo test` (see the `metal` feature comment).
# Back-edge: rlx-sparse/rlx-linalg (tier 9) publish AFTER rlx-runtime
# (tier 7), so keep these PATH-ONLY — cargo strips them from the published
# manifest and `cargo publish -p rlx-runtime` won't resolve them on crates.io.
rlx-sparse = { path = "../../numerics/rlx-sparse", default-features = false, features = ["cpu"] }
rlx-linalg = { path = "../../numerics/rlx-linalg" }
# `rlx-gguf` is now a primary dep (used by `quantized_kv`); kept out of
# dev-dependencies to avoid double-listing.
anyhow = "1"
half = "2"
tempfile = "3"
safetensors = "0.7"

[lints]
workspace = true

# docs.rs builds in a Linux container without macOS (Metal/MLX) or
