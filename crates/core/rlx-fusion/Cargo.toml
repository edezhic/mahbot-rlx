[package]
name = "mahbot-rlx-fusion"
version                = "0.2.18-mahbot.2"
edition.workspace      = true
rust-version.workspace = true
description = "Fusion passes and fused-op decomposition for RLX MIR"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-fusion"

[lib]
name = "rlx_fusion"

[dependencies]
rlx-ir = { workspace = true }

[dev-dependencies]
# Textual-IR fixtures (`tests/text_fixtures.rs`) need rlx-ir's serde derives.
rlx-ir = { workspace = true, features = ["serialize"] }

# Back-edge dev-deps on later-tier crates: keep these PATH-ONLY (no
# `version`). cargo strips path-only dev-deps from the published manifest,
# so `cargo publish -p rlx-fusion` (tier 1) does not try to resolve
# rlx-cpu/rlx-opt (tier 4/5) against crates.io before they exist.
rlx-cpu = { package = "mahbot-rlx-cpu", path = "../../backends/rlx-cpu" }
rlx-opt = { package = "mahbot-rlx-opt", path = "../rlx-opt", features = ["compile"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-fusion --features backend-tests`.
backend-tests = []

[[test]]
name = "fixture_runner"
required-features = ["backend-tests"]

[[test]]
name = "region_limits_decline"
required-features = ["backend-tests"]

[[test]]
name = "rewriter_no_duplicate_leaves"
required-features = ["backend-tests"]

[[test]]
name = "status_reports_are_honest"
required-features = ["backend-tests"]

[[test]]
name = "text_fixtures"
required-features = ["backend-tests"]

[[test]]
name = "trigger_kinds_are_honest"
required-features = ["backend-tests"]
