[package]
name = "rlx-onnx-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX → RLX HIR import (bundle loader, ONNX protobuf, op lowering)"
repository.workspace = true
readme = "README.md"
keywords.workspace      = true
categories.workspace    = true
documentation.workspace = true

[dependencies]
anyhow = "1"
bytemuck = "1"
half = "2"
# Pure-Rust ONNX protobuf types (vendored, protoc-free) — replaces the crates.io
# `onnx` crate whose build.rs invoked the external `protoc` binary.
rlx-onnx-proto = { workspace = true }
protobuf = "1.7"
rlx-ir = { workspace = true, features = ["serialize"] }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.18", default-features = false, features = ["cpu"], optional = true }
rlx-cpu = { workspace = true, optional = true }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-onnx-import --features backend-tests`.
backend-tests = []
runtime = ["dep:rlx-runtime", "dep:rlx-cpu"]

[[bin]]
name = "rlx-onnx-import-report"
path = "src/bin/report.rs"
# No unit tests in this target: the empty harness was pure launch cost.
test = false

[[bin]]
name = "bundle-compile"
path = "src/bin/bundle_compile.rs"
required-features = ["runtime"]

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.18", default-features = false, features = ["cpu"] }
tempfile = "3"

[package.metadata.docs.rs]
features       = ["runtime"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[[test]]
name = "codegen_compile"
required-features = ["backend-tests"]

[[test]]
name = "conv1d_nclw"
required-features = ["backend-tests"]

[[test]]
name = "conv_ncl_typical_length"
required-features = ["backend-tests"]

[[test]]
name = "layout"
required-features = ["backend-tests"]

[[test]]
name = "resize_nearest_height"
required-features = ["backend-tests"]
