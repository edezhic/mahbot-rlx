[package]
name = "mahbot-rlx-mlx-io"
version                = "0.2.18-mahbot.3"
edition.workspace      = true
rust-version.workspace = true
description = "RLX — load MLX weight layouts (mlx-community safetensors dirs, .npz/.npy) including affine / mxfp dequant."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-mlx-io"

[features]
# Reading weights from disk / the HF cache: the loaders (`load_path*`, `.npz`/
# `.npy`, safetensors), `collect_packed_linears`, the llama-like graph builders.
# Without it the crate is the quant math alone — `MlxConfig`, the affine / mxfp
# dequant kernels, RoPE tables — which is all a backend (rlx-cpu, rlx-metal, …)
# uses.
default = ["io"]
io = ["dep:memmap2", "dep:libc", "dep:npyz", "dep:zip", "dep:safetensors"]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-mlx-io --features backend-tests`.
backend-tests = []

[dependencies]
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
memmap2 = { version = "0.9", optional = true }
rayon = "1.10"
libc = { version = "0.2", optional = true }
# `npz` is read with zip 9 directly: npyz's `npz` feature pulls zip 0.6 and
# with it zstd 0.11 (RUSTSEC-2026-0391/0403).
npyz = { version = "0.8", features = ["half"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
safetensors = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rlx-ir = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Path-only: run packed Linear via Session (published manifest strips this).
rlx-runtime = { package = "mahbot-rlx-runtime", path = "../../core/rlx-runtime", default-features = false, features = ["cpu"] }

[[example]]
name = "mlx_dequant_dump"
required-features = ["io"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[[test]]
name = "arch_reference_parity"
required-features = ["backend-tests"]

[[test]]
name = "arch_tiny_decode"
required-features = ["backend-tests"]

[[test]]
name = "arch_tiny_prefill"
required-features = ["backend-tests"]

[[test]]
name = "lazy_offset_cache"
required-features = ["backend-tests"]

[[test]]
name = "mlx_lm_shaped_e2e"
required-features = ["backend-tests"]

[[test]]
name = "synth_affine_dir"
required-features = ["backend-tests"]

[[test]]
name = "synth_affine_session"
required-features = ["backend-tests"]

[lib]
name = "rlx_mlx_io"
# No doctests in this crate: the empty stage was pure rustdoc cost.
doctest = false

