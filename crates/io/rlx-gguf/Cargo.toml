[package]
name = "mahbot-rlx-gguf"
version                = "0.2.18-mahbot.4"
edition.workspace      = true
rust-version.workspace = true
description = "GGUF v1/v2/v3 parser + dequantization to f32. The default `ir` feature maps GGML types to RLX `QuantScheme`; with default features off the crate has no rlx-* deps."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-gguf"

[lib]
name = "rlx_gguf"

[dependencies]
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
rayon = "1.10"
memmap2 = "0.9"
libc = "0.2"
# `ir`: the GGML type → `rlx_ir::quant::QuantScheme` mapping (`quant_scheme`).
rlx-ir = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[features]
# The GGML type → `QuantScheme` mapping is a default here and not upstream: the
# product and every gate build it, and a second feature set is what you get by
# forgetting. `--no-default-features` is the parser-only build — no rlx-* deps,
# unless something else in the graph asks for `ir` (cargo unifies features).
default = ["ir"]
ir = ["dep:rlx-ir"]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-gguf --features backend-tests`.
backend-tests = []

[[test]]
name = "iq_tq_real_weights"
required-features = ["backend-tests"]

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
features       = ["ir"]

[[test]]
name = "from_bytes"
required-features = ["backend-tests"]

[[test]]
name = "skipped_metadata"
required-features = ["backend-tests"]
