[package]
name = "mahbot-rlx-dduf"
version                = "0.2.18-mahbot.2"
edition.workspace      = true
rust-version.workspace = true
description = "RLX — load HuggingFace DDUF (.dduf) ZIP packages of nested safetensors + JSON."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-dduf"

[dependencies]
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
safetensors = "0.7"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
bytemuck = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[lib]
name = "rlx_dduf"
# No doctests in this crate: the empty stage was pure rustdoc cost.
doctest = false
