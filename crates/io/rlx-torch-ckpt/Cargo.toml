[package]
name = "mahbot-rlx-torch-ckpt"
version                = "0.2.18-mahbot.3"
edition.workspace      = true
rust-version.workspace = true
description = "RLX — native reader for PyTorch `torch.save` checkpoints (.pt / .pth / pytorch_model.bin): ZIP index + pickle + dtype decode, no libtorch."
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-torch-ckpt"

[lib]
name = "rlx_torch_ckpt"

[dependencies]
anyhow = "1"
flate2 = "1"
half   = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = false
