[package]
name = "mahbot-rlx-nemo"
version                = "0.2.18-mahbot.1"
edition.workspace      = true
rust-version.workspace = true
description = "RLX — native loader for NVIDIA NeMo `.nemo` model files (tar + torch.save ckpt + YAML config)."
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-rlx-nemo"

[lib]
name = "rlx_nemo"

[dependencies]
anyhow     = "1"
serde_yaml = "0.9"
rlx-ir = { workspace = true }
# The `torch.save` container itself (ZIP + pickle + dtype decode); `.nemo` is
# that checkpoint plus a tar + YAML wrapper.
rlx-torch-ckpt = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-nemo --features backend-tests`.
backend-tests = []

[[test]]
name = "conformer_graph"
required-features = ["backend-tests"]

[[test]]
name = "open_local_nemo"
required-features = ["backend-tests"]
