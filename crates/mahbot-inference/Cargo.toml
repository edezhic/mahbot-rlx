# MahBot inference — the live model paths, end to end, and nothing else.
#
# The stand (`src/stand.rs`, the `mahbot-inference` binary) walks the product
# shapes — recognition, synthesis and the wake word — and records how the models
# do now. The same generation/encoding/decision code is exposed as a library
# (`synth`, `listen`, `transcribe`, `wake`) so the wake-word bench can measure
# recall, false reactions and false accepts per hour on this crate's own models,
# and `transcription-corpus` measures the pinned real-audio corpus.
#
# Every input lives at one fixed path per operating system (src/paths.rs); there
# is no crate-relative default, no environment variable and no argument that names
# a model, corpus or music path.

[package]
name = "mahbot-inference"
version                = "0.2.18-mahbot.2"
edition.workspace      = true
rust-version.workspace = true
description = "MahBot inference: ear, recognition, synthesis and transcription, end to end, on our own models."
authors.workspace      = true
license.workspace      = true
repository             = "https://github.com/edezhic/mahbot-rlx"
documentation          = "https://docs.rs/mahbot-inference"
# Three binaries: without this, a bare `cargo run -p mahbot-inference --features bench`
# is ambiguous. The stand is the product entry point.
default-run = "mahbot-inference"

# The stand. `test = false`: its `main` is one delegation with no test in it, and
# `cargo test` would otherwise link a harness that executes nothing. A test added
# here drops this line.
[[bin]]
name = "mahbot-inference"
path = "src/main.rs"
test = false

# The corpus run: the pinned real-audio recordings through the product's
# transcription call, one row per recording. Deliberate, never automatic.
[[bin]]
name = "transcription-corpus"
path = "src/bin/transcription_corpus.rs"
required-features = ["bench"]

# The corpus build: the one deliberate operation that renders the wake-word
# bench's clips. Not a measurement, and never automatic.
[[bin]]
name = "wake-word-build"
path = "src/bin/wake_word_build.rs"
required-features = ["bench"]

[dependencies]
# The parser under the model loader: GGUF header, metadata, raw tensor bytes, dequant.
rlx-gguf = { workspace = true }
# One window of a model file, mapped per tensor and released with the write it feeds.
memmap2 = "0.9"
# Graph IR + HIR builder (`HirMut`, `HirGraphExt`) used by the emitted blocks.
rlx-ir = { workspace = true }
# Block assembly line: `ModelFlow` / `FlowCtx` / `WeightSource` — the graphs are built on it.
rlx-flow = { workspace = true }
# `gpu` pulls in the wgpu backend.
rlx-runtime = { workspace = true, features = ["gpu"] }
# The wgpu backend itself: the device and adapter name, the shared weight pool's
# scope and release, and the f16 cooperative-matmul admission the loader asks.
rlx-wgpu = { workspace = true }
anyhow = "1"
# Report serialisation.
serde_json = "1"
# Model and corpus provenance (SHA-256 pins) and the deterministic noise RNG.
sha2 = "0.10"
rand = "0.9"
# The voice-activity detector: the wake gate, the speech-hours denominator and
# the transcription path's segmentation (`vad`).
earshot = "1.2"
# The f16 image of a packed weight (`Store::F16Linear`): one rounding per value,
# written as little-endian bits for `set_param_typed(..., DType::F16)`.
half = "2"

[lints]
workspace = true

[features]
# The wake-word bench, its corpus build and the transcription corpus run are
# deliberate, never automatic: without this feature none of them is built.
bench = []
# The ten hand-run targets below. Every test in them is `#[ignore]`d, so a routine
# `cargo test` would link and execute ten binaries that run nothing (207 MiB) and
# pay each one's first-execution assessment; with the bin's `test = false` above,
# that is 11 of the contour's 69 test binaries, so behind this feature the routine
# run is 58. The feature is also what keeps them buildable, type-checked and
# runnable: `just lint` and `just lint-mahbot` enable it, `just test-workspace`
# enables it so the whole-set gate still reaches them, and each file's own doc
# comment carries the command that runs it (`product_checks` names `just
# test-product-checks`).
hand-run = []

[[bench]]
name = "wake_word"
harness = false
# Kept out of a bare `cargo bench`: the run takes minutes and is started by hand.
required-features = ["bench"]

# The hand-run targets: `required-features` is what keeps a test target out of the
# routine run while `cargo test --features hand-run --test <name>` still selects it.
[[test]]
name = "decode_token_rate"
required-features = ["hand-run"]

[[test]]
name = "encoder_qkv"
required-features = ["hand-run"]

[[test]]
name = "multiply_census"
required-features = ["hand-run"]

[[test]]
name = "plane_rebuild"
required-features = ["hand-run"]

[[test]]
name = "predictor_draft"
required-features = ["hand-run"]

[[test]]
name = "product_checks"
required-features = ["hand-run"]

[[test]]
name = "sound_decoder_cost"
required-features = ["hand-run"]

[[test]]
name = "speak_readback"
required-features = ["hand-run"]

[[test]]
name = "wake_multiply_share"
required-features = ["hand-run"]

[[test]]
name = "wake_pair_cost"
required-features = ["hand-run"]
