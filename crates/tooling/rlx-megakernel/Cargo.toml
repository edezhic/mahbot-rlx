[package]
name = "rlx-megakernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone study: how far rlx can compose a MoE block toward a single device program"
publish = false
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
documentation.workspace = true
readme                  = "README.md"

[dependencies]
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }

[dev-dependencies]
rlx-corpus = { path = "../rlx-corpus" }
rlx-runtime = { workspace = true, features = ["cpu"] }

[lints]
workspace = true

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-megakernel --features backend-tests`.
backend-tests = []

[[test]]
name = "composition"
required-features = ["backend-tests"]

[lib]
# No unit tests in this target: the empty harness was pure launch cost.
test = false
# No doctests in this crate: the empty stage was pure rustdoc cost.
doctest = false
