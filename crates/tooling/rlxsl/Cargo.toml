[package]
name = "mahbot-rlxsl"
version = "0.2.18-mahbot.3"
edition.workspace = true
rust-version.workspace = true
description = "Scalar-expression manifest + per-language emitters for RLX's warm-tier unary-activation kernels (single source for WGSL/CUDA/MSL/GLSL/OpenCL activation math, forward + auto-differentiated backward)."
authors.workspace = true
license.workspace = true
repository = "https://github.com/edezhic/mahbot-rlx"
keywords.workspace      = true
categories.workspace    = true
documentation = "https://docs.rs/mahbot-rlxsl"
readme                  = "README.md"

[dependencies]
rlx-ir = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# f64 erf truth for the precision guard (glibc 2.43, validated bit-exact)
rlx-libm = { package = "mahbot-rlx-libm", path = "../../numerics/rlx-libm" }
# Validate that the emitted activation/double-single shaders are real, valid
# shader source: WGSL (wgpu path) via `wgsl-in`, GLSL (native-Vulkan path) via
# `glsl-in`. CUDA/MSL/OpenCL have no toolchain-free parser, so those emitters are
# checked structurally (balanced delimiters + full case coverage).
naga = { version = "29", features = ["wgsl-in", "glsl-in"] }

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[lib]
name = "rlxsl"
# No doctests in this crate: the empty stage was pure rustdoc cost.
doctest = false
