[package]
name = "rlx-linalg"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Dense linear algebra for RLX — eigh / svd / qr / cholesky / solve_triangular via LAPACK. Downstream package; registers against rlx's custom-op scaffold."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-linalg --features backend-tests`.
backend-tests = []
default = ["cpu"]

# CPU execution: pulls in rlx-cpu's CpuKernel registry + LAPACK
# wrappers (`dpotrf`, `dsyevd`, `dgeqrf`, `dgesvd`, `dtrsm`).
cpu = ["dep:rlx-cpu"]

[dependencies]
rlx-ir = { workspace = true }
rlx-cpu = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["cpu"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[[test]]
name = "algos_layout"
required-features = ["backend-tests"]

[lib]
# No doctests in this crate: the empty stage was pure rustdoc cost.
doctest = false
