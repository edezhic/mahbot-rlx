[package]
name = "rlx-vq"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Fused vector-quantization kernel for RLX — nearest-codebook assignment (cdist→argmin) that beats the matmul+argmin composition. Downstream package; registers against rlx's custom-op scaffold."
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
# Integration test targets: off by default (fast smoke gate), `cargo test -p rlx-vq --features backend-tests`.
backend-tests = []
default = ["cpu"]
# CPU execution: registers the fused CpuKernel.
cpu = ["dep:rlx-cpu"]
# Metal execution: registers the fused MetalKernel (macOS only). Also carries
# the wgpu runtime leg of the cross-backend parity test. A `features` request
# from the macOS-only dev-dependency this replaces would instead be unioned into
# *every* crate's test build on that host, which is how a bare `cargo test`
# compiled rlx-metal / rlx-mlx / the vendored MLX C++ build in. The wgpu leg
# skips itself when its backend is absent.
metal = ["dep:rlx-metal", "rlx-runtime/metal", "rlx-runtime/gpu"]
# The parity test's MLX leg, kept separate because `rlx-runtime`'s `mlx` is not
# platform-gated: folding it into `metal` would let the vendored MLX C++ build
# follow a `--features metal` onto Linux.
# Road: `cargo test -p rlx-vq --features metal,mlx,backend-tests`; add
# `-- --test-threads=1` for the parity suite, whose `metal_gpu_beats_cpu` timing
# assert loses to CPU while the other Metal tests run alongside it.
mlx = ["rlx-runtime/mlx"]

[dependencies]
rlx-ir = { workspace = true }
rlx-cpu = { workspace = true, optional = true }
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rlx-metal = { workspace = true, optional = true }

[dev-dependencies]
rlx-runtime = { workspace = true, features = ["cpu"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["cpu"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false

[[test]]
name = "parity"
required-features = ["backend-tests"]

[lib]
# No unit tests in this target: the empty harness was pure launch cost.
test = false
