[workspace]
resolver = "2"
members = [
    # Core (no backend dependencies)
    "crates/core/rlx-ir",          # Tensor IR: types, shapes, ops, graph, verifier
    "crates/core/rlx-tensor",      # Symbolic tensor DSL (operator-overloaded graph building)
    "crates/core/rlx-flow",        # Block assembly-line API for model builders
    "crates/core/rlx-fusion",      # MIR fusion passes + fused-op unfuse
    "crates/core/rlx-unfuse",      # Shared IR unfuse/decompose pass for CUDA/ROCm/wgpu (policy-parameterized)
    "crates/core/rlx-autodiff",    # Reverse/forward-mode AD on MIR
    "crates/core/rlx-compile",     # HIR → MIR → LIR pipeline
    "crates/core/rlx-opt",         # Facade: re-exports fusion + autodiff + compile
    "crates/core/rlx-optim",       # Training-step optimizers (Adam, AdamW, Lion, SOAP, Muon, …)
    "crates/core/rlx-extend",      # Facade: stable extension surface (custom ops + LayerStage + DSL) for downstream

    # Driver layer (devices, arenas, buffers, streams)
    "crates/core/rlx-driver",

    # In-graph collective ops (tensor-parallel all-reduce)
    "crates/core/rlx-collectives",
    # Multi-node pipeline-parallel execution (graph partition + weight-sharded stages)
    "crates/core/rlx-distributed",

    # CPU backend
    "crates/backends/rlx-cpu",         # SIMD kernels, BLAS FFI, thread pool, arena executor

    # GPU backends
    "crates/backends/rlx-metal",       # Apple Metal native (MPS + custom MSL kernels)
    "crates/backends/rlx-mlx",         # Apple MLX (lazy graph + eager modes, hand-rolled C++ shim)
    "crates/backends/rlx-coreml",      # Apple CoreML / Neural Engine (ANE) — IR → MIL ML Program

    "crates/backends/rlx-wgpu",        # Cross-platform GPU via wgpu (Metal/Vulkan/DX12)
    "crates/backends/rlx-cuda",        # NVIDIA CUDA (cuBLAS + NVRTC kernels via cudarc)
    "crates/backends/rlx-rocm",        # AMD ROCm/HIP — same kernels as rlx-cuda
    "crates/backends/rlx-xdna",        # AMD XDNA / Ryzen AI NPU (amdxdna) — Device::Xdna detection + AIE seam
    "crates/backends/rlx-tpu",         # Google TPU via libtpu's PJRT plugin (no Python)
    "crates/backends/rlx-egpu",        # External GPU over USB4/TB on Apple Silicon — IOKit PCI discovery + PCIDriverKit transport

    # Microcontroller backend
    "crates/backends/rlx-cortexm",     # ARMv7E-M (Cortex-M4/M7) INT8 kernels — nRF52840 etc.
    "crates/backends/rlx-cortexm/trainer",  # Native fp32 trainer that emits the INT8 model_weights.rs
    "crates/backends/rlx-mcu",         # no_std int8/int4 kernels + in-place model files for speech models on MCUs

    # FPGA backend
    "crates/backends/rlx-fpga",        # IR → Verilog → bitstream (per-graph datapath, integer-only Q0.31 requant)

    # Cerebras Wafer-Scale Engine backend
    "crates/backends/rlx-cerebras",    # IR → CSL → fabric simulator (single-PE matmul; multi-PE tiling WIP)

    # Native Vulkan compute backend (raw `ash` + embedded SPIR-V kernels)
    "crates/backends/rlx-vulkan",

    # Qualcomm Hexagon NPU backend (AI Engine Direct / QNN)
    "crates/backends/rlx-qnn",        # IR → QNN model C++ → qnn-net-run on the x86 reference backend (Adreno is rlx-vulkan)

    # Intel oneAPI Level Zero backend (Arc / Data Center Max) — dynamic-loaded
    # `libze_loader` + OpenCL-C→SPIR-V compute kernels (peak Intel path).
    "crates/backends/rlx-oneapi",

    # GPU/accelerator backends (future, ranked by hardware-coverage gap)
    # "rlx-directml",  # Windows NPUs (Copilot+ / Hexagon / Intel-AMD NPU) via DirectML

    "crates/io/rlx-gguf",        # GGUF parser + dequant + quant encoders + writer
    "crates/io/rlx-gguf-convert", # safetensors / ONNX → GGUF conversion with per-tensor quant
    "crates/io/rlx-bake",        # Offline weight bake: graph + weights → optimized *.rlx
    "crates/io/rlx-stablehlo",   # Graph → StableHLO MLIR export (IREE / MLIR toolchains)
    "crates/io/rlx-pkg",         # RLX package format (.rlxp): ZIP64/dir, mmap weights, sidecars, dist
    "crates/io/rlx-hub",         # Shard-aware HuggingFace download + verification (layer→shard planning)
    "crates/io/rlx-mlx-io",      # MLX weight layouts: mlx-community dirs, .npz/.npy, affine/mxfp dequant
    "crates/io/rlx-dduf",        # HuggingFace DDUF (.dduf) ZIP of nested safetensors + JSON
    "crates/io/rlx-torch-ckpt",  # PyTorch `torch.save` checkpoint reader (.pt/.pth/.bin): ZIP + pickle
    "crates/io/rlx-nemo",        # NVIDIA NeMo `.nemo` loader (tar + torch.save ckpt + YAML)
    "crates/backends/rlx-gpu-dispatch", # Shape-keyed kernel-variant dispatch table shared by ALL GPU backends
    "crates/backends/rlx-gpu-kernels", # Shared CUDA/HIP .cu sources for rlx-cuda + rlx-rocm
    "crates/backends/rlx-gpu-host",    # Shared host-fallback (D2H→CPU→H2D) staging for rlx-cuda + rlx-rocm
    "crates/backends/rlx-mlx-sys",     # Vendored MLX C++ + rlx_mlx_shim C ABI

    # Proc macros
    "crates/core/rlx-macros",      # #[rlx_model] AOT compilation macro

    # Runtime (user-facing, feature-gated)
    "crates/core/rlx-runtime",     # Session API, backend dispatch

    # MahBot inference: the fork's own subject — the stand, the transcription
    # corpus and the wake-word bench over our models (rlx-wgpu is its backend).
    "crates/mahbot-inference",

    # Prelude crate — re-exports IR + optimizer + runtime + companion
    # crates behind feature gates. The `cargo add rlx` entry point.
    "crates/rlx",

    # Downstream packages (registered against the custom-op scaffold)
    "crates/numerics/rlx-sparse",      # Sparse linear algebra (CSR LU/MatVec/CG) — JAX-style downstream
    "crates/numerics/rlx-linux-ref", # NumPy/SciPy Linux x86-64 reference: OpenBLAS Haswell, LAPACK, x86-simd-sort, x87
    "crates/numerics/rlx-linalg",    # Dense linalg (eigh/svd/qr/cholesky/solve_triangular) via LAPACK
    "crates/numerics/rlx-peft",      # Parameter-efficient adaptation: LoRA/IA3/AdaLoRA/DoRA/OFT
    "crates/numerics/rlx-rng",       # Bit-exact numpy/torch random streams
    "crates/numerics/rlx-numpy",     # Bit-exact numpy host numerics (sum, round, linspace)
    "crates/numerics/rlx-special",   # Bit-exact Boost.Math special functions as SciPy computes them
    "crates/numerics/rlx-pocketfft", # scipy.fft bit-for-bit (SciPy's pinned pocketfft header)
    "crates/numerics/rlx-libm",      # glibc libm (x86_64 FMA variants) bit-for-bit, pure Rust
    "crates/numerics/libm-shim",     # crates.io `libm` → rlx-libm (patched in below)
    "crates/numerics/rlx-fastmath",  # Accurate vectorized f32 exp/log/tanh (NEON), pure Rust
    "crates/numerics/rlx-spectral",  # FFT plans, windows, STFT, mel filterbanks, log-mel / fbank (f32 + f64)
    "crates/numerics/rlx-nnpack",    # torch CPU's NNPACK ft16x16 convolution bit-for-bit
    "crates/numerics/rlx-signal",    # scipy.signal bit-for-bit (IIR/FIR design, lfilter/sosfilt)
    "crates/numerics/rlx-search",    # Host sequence search: argmax/top-k, beam, CTC, forced alignment
    "crates/numerics/rlx-vq",          # Fused vector-quantization kernel (nearest-codebook cdist→argmin)
    "crates/numerics/rlx-fdm",         # Force density method — pin-jointed form-finding (jax_fdm port)
    "crates/numerics/rlx-lbm",         # Moment-encoded lattice Boltzmann (HOME-LBM) — D2Q9/D3Q27
    "crates/numerics/rlx-rl",          # Flow-map policies + FMQ / QGBS (offline-to-online RL)
    "crates/numerics/rlx-bbo",         # Black-box + trust-region Q-guidance / QGBS (domain-agnostic f64)
    "crates/numerics/rlx-umap",        # UMAP / fast-umap custom ops (k-NN from pairwise distances, …)
    "crates/numerics/rlx-geo",         # Exact integer Delaunay + discrete Voronoi custom ops (per-backend)
    "crates/numerics/rlx-fem",         # Nonlinear scalar P1 FEM on triangles (Poisson family)

    # Benchmark framework (PLAN L5)
    "crates/tooling/rlx-bench",       # BenchmarkPattern + per-backend timing harness
    "crates/tooling/rlx-opscope",     # Data-pattern recording harness: inject stat taps, sweep synthetic data, mine exploitable structure
    "crates/tooling/rlx-wsp",         # Weight-space programming: LLM reads/writes weights via a budgeted tool surface
    "crates/tooling/rlx-agent",       # Launch agent CLIs (claude / agent / copilot) against MCP servers; normalised events
    "crates/tooling/rlx-hwprofile",   # Host GPU/VRAM detection for device selection + topology planning
    "crates/tooling/rlx-check",       # `cargo rlx check` — device-free static graph diagnostics
    "crates/tooling/rlx-corpus",      # Named kernel corpus a compiler change must clear
    "crates/tooling/rlx-megakernel",  # Standalone study: MoE block composition toward one device program
    "crates/tooling/rlxsl",
    "crates/bindings/rlx-micro",  # C ABI of rlx-cortexm: INT8 kernels for bare-metal C / C++ firmware
    "crates/bindings/rlx-model-plugin",  # Reference model plugin (a provider librlx_capi loads at run time)
    "crates/tooling/rlx-bindgen",  # rlx-bind op table → C ABI glue, rlx.h, Swift, .pyi  # Scalar-expr manifest → WGSL/CUDA/MSL/GLSL warm-tier kernel codegen
    "crates/io/rlx-onnx",        # ONNX Runtime inference for .onnx files (PLAN B7)
    "crates/io/rlx-onnx-proto",  # Vendored pure-Rust ONNX protobuf types (protoc-free)
    "crates/io/rlx-onnx-import", # ONNX → RLX HIR import + op lowering
    "crates/io/rlx-onnx-conformance", # ONNX op-level ORT parity harness
    "crates/io/rlx-torch-import", # PyTorch (torch.export) → RLX HIR import + bundle/crate emit

    # Text: tokenizer + chat template + sampling (public surface for downstream LM apps)
    "crates/io/rlx-text",
    "crates/io/rlx-program",        # Package programs: host logic as WebAssembly (guest SDK + message format)

    # Language-neutral binding core: the one op table rlx-js, pyrlx and the
    # C ABI are generated from.
    "crates/bindings/rlx-bind",

    # Embedded JavaScript — quickrs (pure-Rust QuickJS-ng) driving the RLX API.
    "crates/bindings/rlx-js",

    # C ABI for the whole rlx surface (generated graph builders + runtime),
    # what Swift and every other FFI language links.
    "crates/bindings/rlx-capi",

    # C ABI for the distributed node — iOS (staticlib → xcframework) and
    # embedded hosts (cdylib), including the host side of an FPGA rank.
    "crates/bindings/rlx-ffi",
]

# ── Excluded: the two browser crates, and the Python binding ─────────
#
# `rlx-web` (the WebAssembly entry point) and `rlx-webgl` (the WebGL2 GPGPU
# backend) stay in the tree only to avoid conflicting with upstream, which edits
# those directories in nearly every release; they will never be used. This
# fork's wgpu backend targets native Metal / Vulkan / DX12 and is never built for
# wasm or run in a browser, so no recipe builds, lints or tests them.
#
# `pyrlx` (the PyO3 + maturin Python binding) is out for the same reason: this
# fork ships no Python surface. Its sources stay so the next sync does not
# conflict over them, and its `tests/` holds one stub that states the binding is
# not built here rather than a suite that needs an extension to import.
#
# Exclusion is what keeps them inert — their manifests inherit from this
# workspace, so they do not resolve standalone either, and nothing can be built
# inside them by accident. Files inside an excluded directory are still *read*:
# four gates read into `crates/bindings/pyrlx` — `rlx-bindgen` regenerates its
# `_pyrlx.pyi`, `scripts/bindings_release.py` reads its `pyproject.toml`,
# `check-doc-links` follows links into it, and `check-rlx-env-vars` sources two
# rows of `docs/rlx-env-vars.md` from the Python files that read them — and
# `just torch-import` runs its pure-Python front-end. That is why the directory
# stays rather than being deleted.
#
# Trade-off, accepted knowingly: `cargo -p rlx-web` / `-p rlx-webgl` /
# `-p pyrlx` no longer resolve, the recipes that selected them are gone, and
# because their sources reference device variants this fork no longer has, the
# two browser crates would not compile. `pyrlx` is excluded for a different
# reason — no Python surface is shipped — but the effect is the same: nothing
# builds it, so no extension is produced and the one file under `tests/` is what
# `pytest` collects.
exclude = [
    "crates/bindings/rlx-web",
    "crates/backends/rlx-webgl",
    "crates/bindings/pyrlx",
]

# ── Default selection (what a bare `cargo build` / `cargo test` operates on) ──
#
# This fork develops one GPU backend (`rlx-wgpu`), so the default contour is an
# explicit enumeration instead of the whole member list. It is NOT `members` and
# must not be read as it: every crate above stays a member and stays addressable
# by name (`cargo test -p rlx-cuda --features backend-tests`). The selection is
# the only form that does both — pruning `members` cannot narrow anything (a path
# dependency inside the workspace directory becomes a member again), and
# `exclude`-ing members outright would break those per-crate invocations.
#
# Deliberately in although the name suggests otherwise: the shared
# `rlx-gpu-dispatch` / `rlx-gpu-host` crates and the `rlx-mlx-io` weight-layout
# reader — none of them is a backend. A bare `cargo build` / `check` / `clippy`
# covers these crates and no others; the whole-set gates name `--workspace`
# explicitly (`just build`, `just lint`, the pre-commit hook's workspace branch).
#
# Trade-off, accepted knowingly: a crate added upstream lands silently OUTSIDE
# this contour until it is listed here, and a member removed or renamed upstream
# makes every bare invocation hard-error until it is dropped.
default-members = [
    # Core (no backend dependencies)
    "crates/core/rlx-ir",
    "crates/core/rlx-tensor",
    "crates/core/rlx-flow",
    "crates/core/rlx-fusion",
    "crates/core/rlx-unfuse",
    "crates/core/rlx-autodiff",
    "crates/core/rlx-compile",
    "crates/core/rlx-opt",
    "crates/core/rlx-optim",
    "crates/core/rlx-extend",
    "crates/core/rlx-driver",
    "crates/core/rlx-collectives",
    "crates/core/rlx-distributed",

    # CPU backend
    "crates/backends/rlx-cpu",

    # wgpu backend + the GPU support crates it and the CPU backend keep
    "crates/backends/rlx-wgpu",
    "crates/backends/rlx-gpu-dispatch",
    "crates/backends/rlx-gpu-host",

    # Proc macros
    "crates/core/rlx-macros",

    # Runtime (user-facing, feature-gated) and the prelude crate
    "crates/core/rlx-runtime",
    "crates/rlx",

    # MahBot inference: the fork's own subject (stand, transcription corpus and
    # wake-word bench)
    "crates/mahbot-inference",

    # IO / weight formats
    "crates/io/rlx-gguf",
    "crates/io/rlx-gguf-convert",
    "crates/io/rlx-bake",
    "crates/io/rlx-pkg",
    "crates/io/rlx-hub",
    "crates/io/rlx-mlx-io",
    "crates/io/rlx-dduf",
    "crates/io/rlx-torch-ckpt",
    "crates/io/rlx-nemo",
    "crates/io/rlx-onnx",
    "crates/io/rlx-onnx-proto",
    "crates/io/rlx-onnx-import",
    "crates/io/rlx-onnx-conformance",
    "crates/io/rlx-torch-import",
    "crates/io/rlx-text",

    # Downstream packages (registered against the custom-op scaffold)
    "crates/numerics/rlx-sparse",
    "crates/numerics/rlx-linalg",
    "crates/numerics/rlx-peft",
    "crates/numerics/rlx-rng",
    "crates/numerics/rlx-vq",
    "crates/numerics/rlx-fdm",
    "crates/numerics/rlx-lbm",
    "crates/numerics/rlx-rl",
    "crates/numerics/rlx-bbo",
    "crates/numerics/rlx-umap",
    "crates/numerics/rlx-geo",
    "crates/numerics/rlx-fem",

    # Tooling
    "crates/tooling/rlx-bench",
    "crates/tooling/rlx-opscope",
    "crates/tooling/rlx-hwprofile",
    "crates/tooling/rlx-check",
    "crates/tooling/rlx-corpus",
    "crates/tooling/rlx-megakernel",
    "crates/tooling/rlxsl",

    # Bindings
    "crates/bindings/rlx-js",
    "crates/bindings/rlx-ffi",
]

# ── Sanitizer / debug profiles (plan #41) ────────────────────────
#
# Borrowed from MAX's --config=asan / --config=debug-modular pattern.
# Run sanitized builds with:
#
#   cargo +nightly build --profile=asan
#   cargo +nightly test  --profile=asan
#
# AddressSanitizer needs the nightly toolchain on most targets; on
# Apple Silicon it compiles fine via `RUSTFLAGS="-Zsanitizer=address"`
# (which we set per-profile via .cargo/config.toml when present).
# `debug-rlx` is a stable-toolchain debug profile with extra checks
# (overflow, debug-assertions, less inlining for tractable backtraces).

[profile.asan]
inherits = "dev"
debug = "full"
debug-assertions = true
overflow-checks = true
opt-level = 1
lto = false
incremental = false

# ── Workspace-wide lint posture (plan #17) ─────────────────────
#
# Tightens the bar without going to "deny all the things." Crates can
# locally `#[allow(...)]` for genuinely-needed exceptions. Pair with
# `cargo clippy --all-targets --features backend-tests -- -D warnings` in CI —
# bare, because the default selection is this fork's contour (see
# `default-members` above). The whole set is `just lint-workspace`, run once per
# upstream sync; `just lint` is the routine gate and names no `--workspace`.
#
# Not yet enabled (would generate ~1000 warnings to fix in one go):
#   missing_docs / unsafe_op_in_unsafe_fn / clippy::pedantic.
# Add them as crates reach individual readiness.

[workspace.package]
version       = "0.2.20"
edition       = "2024"
rust-version  = "1.89"  # edition=2024 needs ≥1.85; `is_multiple_of` ≥1.87; AVX-VNNI
                        # `_mm256_dpbusd_*` intrinsics (rlx-cpu x86 Q2_0 dot) ≥1.89
license       = "MIT OR Apache-2.0"
authors       = ["Eugene Hauptmann", "Nataliya Kosmyna"]
repository    = "https://github.com/MIT-RLX/rlx"
documentation = "https://docs.rs/rlx"
keywords      = ["ml", "tensor", "compiler", "neural-network", "autodiff"]
categories    = ["science", "algorithms", "compilers"]

[workspace.dependencies]
# Internal crates — one source of truth for path + version. Members
# reference these via `{ workspace = true, .. }` (features/optional per-use).
#
# The 22 crates the fork's product paths use are published under `mahbot-`
# names at the fork version `0.2.18-mahbot.2`; each pins that version itself,
# and everything else keeps upstream's identity. A renamed entry keeps its
# upstream key — `rlx-ir` below is the `mahbot-rlx-ir` package — so dependency
# tables and the source files that import them do not change, and each renamed
# crate pins `[lib] name` to the module upstream's sources use. See
# docs/fork-publishing.md.
rlx = { path = "crates/rlx", version = "0.2.20" }
rlx-autodiff = { package = "mahbot-rlx-autodiff", path = "crates/core/rlx-autodiff", version = "0.2.18-mahbot.2" }
rlx-bake = { path = "crates/io/rlx-bake", version = "0.2.20" }
rlx-bbo = { path = "crates/numerics/rlx-bbo", version = "0.2.20" }
rlx-bench = { path = "crates/tooling/rlx-bench", version = "0.2.20" }
rlx-cerebras = { path = "crates/backends/rlx-cerebras", version = "0.2.20" }
rlx-check = { path = "crates/tooling/rlx-check", version = "0.2.20" }
rlx-collectives = { path = "crates/core/rlx-collectives", version = "0.2.20" }
rlx-compile = { package = "mahbot-rlx-compile", path = "crates/core/rlx-compile", version = "0.2.18-mahbot.2" }
rlx-coreml = { path = "crates/backends/rlx-coreml", version = "0.2.20" }
rlx-cortexm = { path = "crates/backends/rlx-cortexm", version = "0.2.20" }
rlx-cortexm-trainer = { path = "crates/backends/rlx-cortexm/trainer", version = "0.2.20" }
rlx-mcu = { path = "crates/backends/rlx-mcu", version = "0.2.20", default-features = false }
rlx-cpu = { package = "mahbot-rlx-cpu", path = "crates/backends/rlx-cpu", version = "0.2.18-mahbot.2" }
