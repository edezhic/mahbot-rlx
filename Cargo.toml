[workspace.lints.rust]
unused = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Common false positives in numeric / SIMD code.
manual_range_contains = "allow"
needless_range_loop   = "allow"
too_many_arguments    = "allow"
upper_case_acronyms   = "allow"
# `as_chunks::<N>()` narrows the item from `&[u8]` to `&[u8; N]`, which breaks
# `try_into()` call sites — `cargo clippy --fix` then reverts the whole crate.
chunks_exact_to_as_chunks = "allow"
# Macro / FFI-driven noise we don't want to silence per call-site.
useless_conversion          = "allow"  # pyo3 ?-into-PyErr boilerplate
missing_safety_doc          = "allow"  # cover incrementally; not 1.0.0-blocking
doc_overindented_list_items = "allow"  # rustfmt-vs-clippy disagreement
doc_lazy_continuation       = "allow"  # same family — multi-line list continuations
unnecessary_wraps           = "allow"  # API symmetry > "this could be infallible"
type_complexity             = "allow"  # IR types are intentionally explicit
large_enum_variant          = "allow"  # Op enum carries Box<Graph> in CustomFn / Scan
single_range_in_vec_init    = "allow"  # `vec![0..1]` is fine in tests / scaffolding
collapsible_if              = "allow"  # nested-if is often more readable in numeric code
should_implement_trait      = "allow"  # builder methods named like trait methods

# Cargo manifest lints (new warn-by-default set as of Rust 1.100). Both allows
# below are deliberate design, not deferred cleanup — see the rationale on each.
[workspace.lints.cargo]
# `[workspace.dependencies]` is intentionally a COMPLETE registry of every
# internal crate (see its header comment: "one source of truth for path +
# version"). 25 entries currently have no member referencing them via
# `{ workspace = true }`; keeping them means adding a dependency is a one-line
# edit in the member, not a path+version copy. Dropping them to satisfy the
# lint would defeat the registry.
unused_workspace_dependencies = "allow"
# Feature-plumbing dependencies read as "unused" because no lib code imports
# them, but the `[features]` table requires them as real dependencies — e.g.
# `rlx-peft` has `cpu = ["rlx-runtime/cpu"]`, `metal = ["rlx-runtime/metal"]`,
# … so removing `rlx-runtime` is a hard error and moving it to dev-dependencies
# would silently break the feature pass-through for downstream consumers.
unused_dependencies = "allow"

[profile.debug-rlx]
inherits = "dev"
debug = "full"
debug-assertions = true
overflow-checks = true
opt-level = 1
lto = false
incremental = true

# Size-tuned profile for the Apple xcframework (`ios/build-xcframework.sh`).
#
# The artifact ships inside a phone, TV, headset or watch app, so bytes are a
# product constraint rather than a preference. Measured on a linked watchOS
# release app before this profile existed: 8.08 MB __TEXT, of which 1.16 MB was
# unwinding metadata alone (__eh_frame 709 KB, __gcc_except_tab 329 KB,
# __unwind_info 124 KB).
#
# `panic = "abort"` is what removes that, and it is not a behaviour change
# here: every entry point in rlx-ffi is `extern "C"`, and a panic across that
# boundary already aborts. Nothing in the crate catches unwinds.
#
# `opt-level` stays at 3 on purpose. This is numeric kernel code running on a
# thermally-limited device — trading throughput (and therefore energy per
# token) for bytes is the wrong trade. The size comes from the linker and the
# dependency graph instead; see rlx-runtime's `model-io` feature.
#
# `-Zbuild-std` users: the profile's `panic = "abort"` needs
# `-Zbuild-std=std,panic_abort`, which the build script passes.
[profile.apple]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The `libm` that naga and num-traits (via half) depend on, answered by
# rlx-libm: no musl copy in rlx's dependency tree. The real crate remains a
# validation dev-dependency only (pinned `=0.2.16`, so the patch skips it).
[patch.crates-io]
libm = { path = "crates/numerics/libm-shim" }
