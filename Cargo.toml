rlx-dduf = { package = "mahbot-rlx-dduf", path = "crates/io/rlx-dduf", version = "0.2.18-mahbot.2" }
rlx-distributed = { path = "crates/core/rlx-distributed", version = "0.2.20" }
rlx-driver = { package = "mahbot-rlx-driver", path = "crates/core/rlx-driver", version = "0.2.18-mahbot.2" }
rlx-extend = { path = "crates/core/rlx-extend", version = "0.2.20" }
rlx-fdm = { path = "crates/numerics/rlx-fdm", version = "0.2.20" }
rlx-lbm = { path = "crates/numerics/rlx-lbm", version = "0.2.20" }
