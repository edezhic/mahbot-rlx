# The compiler this tree is built with — the choice, in one place. `cargo` below
# this directory obeys it, and the CI jobs name it again because the toolchain
# action does not read this file. Four things override it on purpose, each
# saying why beside itself: crates/backends/rlx-ps5/rust-toolchain.toml, the
# `cargo +nightly` rows in `just check-apple` and `ios/build-xcframework.sh`
# (all three need nightly's `-Zbuild-std`), and the asan profile in Cargo.toml.
#
# It is not the minimum: `rust-version` there is what a member may assume, and
# it stays where it is — a floor selects nothing, this file names a compiler.
#
# `clippy` and `rustfmt` are what the lint and format gates invoke, and a
# minimal-profile install ships neither. No target is declared: the one
# cross-lint row that needs another platform — x86-64 macOS in `just lint` — has
# to be installed by hand (`rustup target add x86_64-apple-darwin`) and skips
# where it is not. Naming it here would make provisioning this toolchain fetch
# that platform's std on every machine and CI runner, for a row that is guarded
# off everywhere but an Apple Silicon host.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
